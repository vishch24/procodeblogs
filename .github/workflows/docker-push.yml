# Goal Push the images to DockerHub 
name: Docker Push

on: 
    workflow_call:

jobs:
  build-and-push:
    # Github runner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: 'docker/nginx'
            name: 'nginx'
          - folder: 'docker/php-fpm'
            name: 'php-fpm'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.include.folder }}
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/procodeblogs_${{ matrix.include.name }}:latest
                
